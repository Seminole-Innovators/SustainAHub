    <style>
        /* #calendar-content.columns-layout {

        /* section.columns-container {

        html, body {
            height: 100%;
            margin: 0;
            overflow: hidden; /* Page shouldn't scroll */
        }

        body {
            display: flex;
            flex-direction: column;
        }

        header, footer {
            flex: 0 0 auto;
        }

        main.events-page {
            flex: 1 1 auto;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        section.event-column {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            background: url('../icons/bg/eventsBg.jpg') center center / cover no-repeat;
        }

        .event-card {
            width: 100%;
            max-width: 1000px;
            position: relative;
            color: white;
            border-radius: 10px;
            margin-bottom: 20px;
            padding: 40px;
            padding-left: 50px;
            transition: all 0.3s ease;
            overflow: visible;
            background-image: url('../icons/bg/patch.png');
            background-size: 100% 100%;     /* STRETCH both width and height */
            background-repeat: no-repeat;
            background-position: center center;
            font-weight: 900;
        }

        .event-column {
            display: flex;
            flex-direction: column;
            align-items: center; /* Center cards horizontally */
            overflow-y: auto;
            padding: 20px;
            width: 100%; /* Full width of container */
            height: 100%;
            box-sizing: border-box;
        }

        .event-card > * {
            position: relative;
            z-index: 1;
        }

        .card-header {
            margin-bottom: 5px;
            font-size: 2em;
        }

        .expandable-info {
            display: none;
            margin-top: 10px;
        }
        .event-card.expanded .expandable-info {
            display: block;
        }
        .expand-btn {
            margin-top: 5px;
            cursor: pointer;
            background-color: var(--first-green);
            color: white;
            border: none;
            border-radius: 5px;
            padding: 5px 10px;
        }
    </style>
</head>
