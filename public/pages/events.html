<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Our Patch - Events</title>

    <!-- Favicon (small icon on tab) -->
    <link rel="icon" type="image/png" href="" sizes="32x32">

    <!-- Open Graph Meta Tags for Social Media -->
    <meta property="og:title" content="Our Patch - Events">
    <meta property="og:description" content="Find and explore local environmental events.">
    <meta property="og:image" content="">
    <meta property="og:url" content="">

    <!-- Apple Touch Icon -->
    <link rel="apple-touch-icon" href="">

    <!-- Symbol library -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">

    <!-- Preserve site-wide styles -->
    <link rel="stylesheet" href="styles.css">

    <style>
        /* #calendar-content.columns-layout {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            margin: 0;
            width: 100%;
            max-width: none;
            padding: 0;
        } */
        /* section.columns-container {
            display: flex;
            flex: 1;
            overflow: hidden;
            width: 100%;
            border: 2px solid #bbb;
        } */

        html, body {
          height: 100%;
          overflow: hidden;
          margin: 0;
        }

        body {
          display: flex;
          flex-direction: column;
        }

        header, footer {
          flex: 0 0 auto;
        }

        main.events-map-layout {
          flex: 1 1 auto;
          display: flex;
          height: 100%;
          overflow: hidden;
        }

        /* LEFT: Scrollable event list */
        .event-list {
          flex: 0 0 33.33%;
          display: flex;
          flex-direction: column;
          overflow-y: auto;
          padding: 20px;
          background: url('../icons/bg/eventsBg.jpg') center center / cover no-repeat;
        }

        /* RIGHT: Full-height Leaflet map */
        .event-map {
          flex: 1;
          display: flex;
          flex-direction: column;
          overflow: hidden;
        }

        #map {
          flex: 1;
          width: 100%;
          height: 100%;
          z-index: 0;
        }

        /* Styling for event cards */
        .event-card {
          width: 100%;
          max-width: 100%;
          position: relative;
          color: white;
          border-radius: 10px;
          margin-bottom: 20px;
          padding: 40px;
          padding-left: 50px;
          transition: all 0.3s ease;
          overflow: visible;
          background-image: url('../icons/bg/patch.png');
          background-size: 100% 100%;
          background-repeat: no-repeat;
          background-position: center center;
          font-weight: 900;
        }

        .card-header {
          font-size: 2em;
          margin-bottom: 5px;
        }

        .expandable-info {
          display: none;
          margin-top: 10px;
        }

        .event-card.expanded .expandable-info {
          display: block;
        }

        .expand-btn {
          margin-top: 5px;
          cursor: pointer;
          background-color: var(--first-green);
          color: white;
          border: none;
          border-radius: 5px;
          padding: 5px 10px;
        }

    </style>
</head>
<body class="bg">
    <header>
        <div class="container">
            <h1 class="logo">
                <img src="../icons/ourpatch2.png" alt="Our Patch Logo">
              </h1>
            <nav>
                <ul class="image-nav">
                  <li>
                    <a href="../index.html" class="nav-img-button">
                      <img src="../icons/homeIcon.png" alt="Home">
                    </a>
                  </li>
                  <li>
                    <a href="map.html" class="nav-img-button">
                      <img src="../icons/locationsIcon.png" alt="Locations">
                    </a>
                  </li>
                  <li>
                    <a href="calendar.html" class="nav-img-button active">
                      <img src="../icons/eventsIcon.png" alt="Events">
                    </a>
                  </li>
                  <li>
                    <a href="aboutus.html" class="nav-img-button">
                      <img src="../icons/aboutIcon.png" alt="About Us">
                    </a>
                  </li>
                  <li>
                    <a href="contact.html" class="nav-img-button">
                      <img src="../icons/contactIcon.png" alt="Contact">
                    </a>
                  </li>
                </ul>
              </nav>              
        </div>
    </header>

    <main class="events-map-layout">
      <section class="event-list">
        <!-- Event cards will load here -->
      </section>
      <section class="event-map">
        <div id="map"></div>
      </section>
    </main>

    <footer>
        <div class="container">
            <p>Our Patch &copy; 2025</p>
        </div>
    </footer>

    <script src="../scripts/eventscript.js" type="module">
        
    </script>
</body>
</html>
